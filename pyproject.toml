[project]
name = "scara"
version = "0.1.0"
description = "SCARA pick and place com visão"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# só para escolher caixas pelo nome (--nome / --ordem), via projeto only-vision
nomes = ["python-dotenv>=1.0", "google-genai>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
